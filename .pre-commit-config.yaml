# Git hooks. `make install` enables them; `pre-commit run --all-files` checks everything.
# The spec file is the human's source document, so hooks never rewrite it.
exclude: ^NightWatch-SPEC\.md$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  # Runs in its own environment, so it works even when .venv isn't activated.
  # Keep additional_dependencies in step with what the code imports.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies:
          - pytest==9.2.0
          - boto3==1.43.120
          - boto3-stubs[dynamodb,ssm,lambda,cloudwatch]==1.43.120
          - pydantic==2.14.1
          - moto==5.2.5

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt
        language: system
        files: \.tf$

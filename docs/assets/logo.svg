<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NightWatch">
  <defs>
    <linearGradient id="nw-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <mask id="nw-cut">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="35.5" cy="27" r="15.5" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#nw-sky)"/>
  <circle cx="30" cy="34" r="17" fill="#fbbf24" mask="url(#nw-cut)"/>
  <circle cx="47" cy="15" r="2.6" fill="#fde68a"/>
  <circle cx="52.5" cy="27" r="1.6" fill="#fde68a" opacity=".8"/>
</svg>

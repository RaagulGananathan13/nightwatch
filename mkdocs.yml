site_name: NightWatch Docs
site_description: Documentation for NightWatch, an open-source on-call agent for AWS
site_author: NightWatch contributors
site_url: https://raagulgananathan13.github.io/nightwatch/
repo_url: https://github.com/RaagulGananathan13/nightwatch
repo_name: nightwatch
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 NightWatch contributors. Licensed under the Apache License 2.0.

theme:
  name: material
  custom_dir: overrides # .icons/nightwatch/logo.svg, the header mark
  favicon: assets/favicon.svg
  font: false # IBM Plex Sans and Mono load from extra.css
  icon:
    logo: nightwatch/logo
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  # Dark by default; the reader can switch to light, and the choice is remembered.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RaagulGananathan13/nightwatch
      name: NightWatch on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      title: On this page
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

